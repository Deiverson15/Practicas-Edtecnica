<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo IV - Práctica N°19 - Reserva de Vuelos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="text-center my-4">
        <h1 class="titulo">AeroLínea Express</h1>
        <p class="text-white lead">Módulo IV - Práctica N°19: Reserva de Vuelos</p>
    </header>

    <div class="container bg-white p-4 rounded-4 shadow-lg" id="contenido">
        <div class="row g-4">
            

            <div class="col-lg-5 col-md-12 agregar-vuelo">
                <div class="p-3 border rounded-3 bg-light">
                    <h3 class="text-center mb-3 text-primary fw-bold">Reservar Pasaje</h3>
                    
                    <form id="nueva-reserva">
                        <div class="mb-3">
                            <label for="pasajero" class="form-label fw-bold">Nombre del Pasajero:</label>
                            <input type="text" class="form-control" id="pasajero" name="pasajero" placeholder="Ej. Carlos Mendoza">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="documento" class="form-label fw-bold">Documento / Pasaporte:</label>
                                <input type="text" class="form-control" id="documento" name="documento" placeholder="Ej. V-20123456">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label fw-bold">Teléfono:</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+58 412 0000000">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="origen" class="form-label fw-bold">Origen:</label>
                                <select class="form-select" id="origen" name="origen">
                                    <option value="" disabled selected>Seleccione origen</option>
                                    <option value="Caracas (CCS)">Caracas (CCS)</option>
                                    <option value="Maracaibo (MAR)">Maracaibo (MAR)</option>
                                    <option value="Valencia (VLN)">Valencia (VLN)</option>
                                    <option value="Bogotá (BOG)">Bogotá (BOG)</option>
                                    <option value="Madrid (MAD)">Madrid (MAD)</option>
                                    <option value="Miami (MIA)">Miami (MIA)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="destino" class="form-label fw-bold">Destino:</label>
                                <select class="form-select" id="destino" name="destino">
                                    <option value="" disabled selected>Seleccione destino</option>
                                    <option value="Caracas (CCS)">Caracas (CCS)</option>
                                    <option value="Maracaibo (MAR)">Maracaibo (MAR)</option>
                                    <option value="Valencia (VLN)">Valencia (VLN)</option>
                                    <option value="Bogotá (BOG)">Bogotá (BOG)</option>
                                    <option value="Madrid (MAD)">Madrid (MAD)</option>
                                    <option value="Miami (MIA)">Miami (MIA)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fecha" class="form-label fw-bold">Fecha del Vuelo:</label>
                                <input type="date" class="form-control" id="fecha" name="fecha">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="clase" class="form-label fw-bold">Clase:</label>
                                <select class="form-select" id="clase" name="clase">
                                    <option value="" disabled selected>Seleccione clase</option>
                                    <option value="Económica">Económica</option>
                                    <option value="Premium Economy">Premium Economy</option>
                                    <option value="Ejecutiva / Business">Ejecutiva / Business</option>
                                    <option value="Primera Clase">Primera Clase</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="asiento" class="form-label fw-bold">Preferencia de Asiento / Equipaje Especial:</label>
                            <textarea class="form-control" id="asiento" name="asiento" rows="3" placeholder="Ej. Ventana fila 12, equipaje extra, comida vegetariana..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase">Confirmar Reserva</button>
                    </form>
                </div>
            </div>


            <div class="col-lg-7 col-md-12">
                <h3 class="text-center mb-3 text-secondary fw-bold">Tarjetas de Embarque Registradas</h3>
                <div id="reservas" class="lista-reservas"></div>
            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/reservacion.js"></script>
</body>
</html>
