<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta del Clima</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="contenedor bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full border border-white/20">
        <h1 class="text-3xl font-extrabold text-center text-slate-800 mb-6 tracking-tight">
            Buscador de Clima
        </h1>

        <form id="formulario" class="space-y-5">
            <div>
                <label for="ciudad" class="block text-sm font-semibold text-slate-700 mb-1">Ciudad:</label>
                <input 
                    type="text" 
                    id="ciudad" 
                    name="ciudad" 
                    placeholder="Ej: Caracas, Madrid, Buenos Aires" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                >
            </div>

            <div>
                <label for="pais" class="block text-sm font-semibold text-slate-700 mb-1">País:</label>
                <select 
                    id="pais" 
                    name="pais" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                >
                    <option value="" disabled selected>-- Selecciona un país --</option>
                    <option value="VE">Venezuela</option>
                    <option value="US">Estados Unidos</option>
                    <option value="MX">México</option>
                    <option value="CO">Colombia</option>
                    <option value="AR">Argentina</option>
                    <option value="ES">España</option>
                    <option value="CL">Chile</option>
                    <option value="PE">Perú</option>
                </select>
            </div>

            <button 
                type="submit" 
                id="btn-buscar" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98]"
            >
                Obtener Clima
            </button>
        </form>

        <!-- Contenedor donde se imprimirán los resultados o spinner -->
        <div id="resultado" class="mt-6 text-center text-slate-700"></div>
    </div>

    <script src="js/clima.js"></script>
</body>
</html>
