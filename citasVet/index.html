<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Citas Veterinarias / Médicas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="text-center my-4">
        <h1 class="titulo">Administrador de Citas</h1>
    </header>

    <div class="container bg-white p-4 rounded shadow-lg" id="contenido">
        <div class="row">
            
            <!-- Columna del Formulario -->
            <div class="col-md-6 agregar-cita">
                <h2 class="text-center mb-4 text-primary font-weight-bold">Crear Nueva Cita</h2>
                
                <form id="nueva-cita">
                    <div class="mb-3">
                        <label for="mascota" class="form-label font-weight-bold">Nombre Mascota / Paciente:</label>
                        <input type="text" class="form-control" id="mascota" name="mascota" placeholder="Ej. Firulais o Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label for="propietario" class="form-label font-weight-bold">Propietario / Responsable:</label>
                        <input type="text" class="form-control" id="propietario" name="propietario" placeholder="Nombre completo">
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label font-weight-bold">Teléfono de Contacto:</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej. 04141234567">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label font-weight-bold">Fecha:</label>
                            <input type="date" class="form-control" id="fecha" name="fecha">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="hora" class="form-label font-weight-bold">Hora:</label>
                            <input type="time" class="form-control" id="hora" name="hora">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="sintomas" class="form-label font-weight-bold">Síntomas / Motivo de consulta:</label>
                        <textarea class="form-control" id="sintomas" name="sintomas" placeholder="Describe los síntomas o el motivo de la cita"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Crear Cita</button>
                </form>
            </div>

            <!-- Columna del Listado de Citas -->
            <div class="col-md-6">
                <h2 class="text-center mb-4 text-secondary font-weight-bold">Citas Registradas</h2>
                <div id="citas" class="lista-citas"></div>
            </div>

        </div>
    </div>

    <!-- Script de Bootstrap y tu archivo JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/cita.js"></script>
</body>
</html>
